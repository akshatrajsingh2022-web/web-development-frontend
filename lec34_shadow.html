<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abt box shadow</title>
    <style>
        .box1{
            color:  rgb(0, 0, 0);
            padding: 12px;
            border: 1px solid black;
            margin: 12px;
            box-sizing: border-box;
            box-shadow:0px 2px 14px 2px rgb(250, 2, 101);
            text-shadow: 1px 1px 1px  rgb(250, 2, 101);
            size: 33px;
        }
        
    </style>
</head>
<body>
    <div class="box1">
        <h1>
            hii this is a box which is block elements
        </h1>
    </div>
</body>
</html>
