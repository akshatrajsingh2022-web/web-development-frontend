<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ball bounce</title>
    <style>
        .container{
            height: 100vh;
            width: 100vw;
            background-color: black;
            display: flex;
            align-items: end;
            

        }
        .ball{

            height: 80px;
            width: 80px;
            border-radius: 100%;
            position: absolute;
            background-color: pink;
            animation: animateX 10s linear  infinite  alternate 
            , animateY 3s ease-out  infinite  alternate ;
            box-shadow: 0px 0px 23px 13px rgb(207, 19, 151);
            
        }
        @keyframes animateX{
            from{
                left: 0;
            }
            to{  
                left: 90%;
                /* transform: translatex(90vw); */
            }
        }
        @keyframes animateY{
            from{
                bottom: 0;
            }  
            to{
                bottom: 89%;
            } 
        }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>
</html>
