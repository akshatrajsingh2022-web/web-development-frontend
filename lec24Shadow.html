<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow</title>
</head>
<style>
    .box1{
        display: inline-block;
        padding: 33px;
        margin: 14px;
        border: 2px solid burlywood;
        box-shadow: 0px 1px 22px 2px pink inset ;
    }
    .textshadow{
        text-decoration: line-through;
        text-decoration-color: indianred;
        text-decoration-style: wavy;
        font-size: larger;
        text-align: center;
        text-shadow: 0px 2px 2px  rgb(89, 89, 227);
    }
    div{
        border: 3px solid red;
       padding: 2px;
        margin: 2px;
        outline: 3px solid yellow;
        outline-offset: 5px ;
        outline-style:dotted;
        border-radius: 44px;
    }
</style>
<body>
    <span class="box1">
        i am box1...hii i am a span and i am demo of box shadow
    </span>
    <p class="textshadow">hii i am a para and i am exampl of text shadow</p>
    <br>
    <br>
    <div>
        hii i am div and here i will explain the concept of border vs outline 
    </div>
</body>
</html>
