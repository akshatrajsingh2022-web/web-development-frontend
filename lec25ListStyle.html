<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar</title>
</head>
<style>
    nav{ 
        text-align: center;
        color: yellow;
        background-color: black;
        border:2px solid rebeccapurple;
        /* display: inline-flex; */
    }
    ul{
        display: flex ; 
        margin: 0px;
        padding: 0;
        gap: 3px;
        justify-content: center;
    }
    nav ul li{
        /* list-style: none ; */
        list-style-type:"😎";
        padding: 9px;
        list-style: "😎" inSide;
        border: 4px solid rgb(152, 165, 251);
        background-color: paleturquoise;
        /* list-style-position: inside; */
    }
</style>
<body>
    <nav>
        welcome
        <ul>
            <li>home</li>
            <li>about</li>
            <li>order</li>
         </ul>
    </nav>
</body>
</html>
