<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            height: 113px;
            width: 80vw;
            padding: 2px;
            border: 3px solid red;
            margin: 3px;
        }
        .box1{
            background-color:rgb(139, 130, 149);
            position: sticky;
            height: 2px;
            top: 0px;
            /* position: absolute; */
            /* top: 0px;
            left: 3px; */
        }
        .box2{
            background-color: pink;
            position:relative;
            left: 3px;
            z-index: 1;
            top:33px
        
            
            
        }
        .box3{
            background-color: rgb(156, 220, 20);
            position: absolute;
            z-index: 3;
            width: 90vw; 
        }
        .box4{
            background-color: rgb(0, 0, 0);
             position: relative;
            z-index: 4;
            left: 22px; 
            position: fixed;
            height: 1px;
            bottom: 3px;
            left: 3px;
        }
        .parent{
            margin: 3px;
            border: 3px solid yellow;
            padding: 4px;
            height: 1131px;
        }
    </style>
</head>
<body> 
    <div class="parent">
        <div class="box box1"> BOX1</div>
        <div class="box box2">BOX2</div>
        <div class="box box3">BOX3</div>
        <div class="box box4">BOX4</div>
    </div>

</body>
</html>
