<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: grey;
        }
        div{
            text-align: center;
            background-color:white;

            border: 1px solid saddlebrown;
            border-radius: 33px;
        }
        img{
            border: 2px solid black;
            border-radius: 33px;
            height: 133px;
            width: 133px;
            display: inline-flex;justify-content: center;
        }

        ul {
            display: flex;
            list-style: none;
            padding:6px;
        }
        ul li{
            border: 1px solid black;
            border-radius: 9px;
            padding: 3px;
            margin: 3px;
            margin-left: 0px;
        }
        footer{
            color: blue;
            background-color: aqua;
            border: 1px solid beige;
            border-radius: 23px;
            display: inline-flex;
            justify-content: center;
            padding: 6px;
            position: sticky;
        }
        h1{
            text-transform: capitalize;
        }
    </style>
</head>
<body >
    <div>
        <img  src="image.png" alt="train">
        <ul>
            <li>Nature</li>
            <li>lakes</li>
        </ul>
        <h1>lago di braies</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Blanditiis vitae praesentium, magnam nisi nihil distinctio est minus pariatur atque, deleniti tempora nam reiciendis saepe enim repellendus, soluta corrupti consectetur impedit.</p>
        <footer>learn more</footer>
    </div>
</body>
</html>
