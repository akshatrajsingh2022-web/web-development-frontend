<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms--all</title>
    <style>
        body{
            background-color: rgb(29, 65, 16);
        }
    </style>
</head>
<body>
    <form action="post">
        <label for="username">username</label>
        <input type=" text" name="fathername" placeholder="enter fathername" id="fathername">
        <br>
        <input type="text" id="username" name="username" placeholder="enter your name " >
        <label for="gender">male</label>
        <input type="checkbox" name="gender" id="male">
        <label for="gender">female</label>
        <input type="checkbox" name="female" id="female">

        <br> 
        <label for="gender">male
        <input type="radio" name="gender" id="male" value="male">
        <label for="gender">female</label>
        <input type="radio" name="gender" value="femalef" id="female">
        </label>
        <br>
        <label for="comment">enter some feedback</label>
        <textarea name="comments" rows="3" cols="10" id="comment"></textarea>
    </form>
</body>
</html>
