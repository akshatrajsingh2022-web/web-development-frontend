<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex boxy</title>
    <style>
        .container{
            height: 50vh;
            border: 3px dotted red;
            display:flex;
            /* justify-content: center; */
            /* align-items:center; */
            /* align-content:flex-start; */
            /* flex-direction: column; */
            /* flex-direction:row-reverse; */
            /* flex-wrap: wrap; */
            row-gap: 4px;
            column-gap: 1px;
        }
        .item{
            background-color: seagreen;
            width: 43px;
            /* margin: 3px; */
            height: 23px;
            border: 3px solid pink;
            text-align: center;
        }
        .order-1{
            order: 1;
        }
        .order-2{
            order: 2;
        }
        .itemGrow{
            flex-grow:2;
            align-self: flex-end;
        }
        .itemShrink{
            flex-shrink:2;
            background-color: rgb(250, 56, 56);
            align-self: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item order-1">1</div>
        <div class="item order-2">2</div>
        <div class="item itemGrow">3</div>
        <div class="item itemShrink">u4</div>
        <div class="item">5</div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
